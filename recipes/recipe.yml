# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Fedora Kinoite com Virt-Manager, Waydroid, ADB, Steam (Flatpak) e RPM Fusion.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        - atim/starship
    install:
      packages:
        # Codecs e Multimídia (RPM Fusion)
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-libav
        - libheif-freeworld

        # Ferramentas Base & Shell
        - micro
        - starship
        - distrobox
        - android-tools

        # Virtualização & Containers
        - virt-manager
        - waydroid

  # Módulo para instalar o Steam via Flatpak no primeiro boot
  - type: default-flatpaks
    configurations:
      - scope: user
        install:
          - com.valvesoftware.Steam
