# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Fedora Kinoite 45 com Virt-Manager, Waydroid, Steam nativa e EasyFlatpak.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
      files:
        - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%fedora%.noarch.rpm
        - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%fedora%.noarch.rpm
    install:
      packages:
        - micro
        - starship
        - distrobox
        - steam
        # Virt-Manager completo (dnsmasq e firefox já vêm nativos na base)
        - virt-manager
        - libvirt
        - qemu
        - bridge-utils
        # Waydroid
        - waydroid

  - type: systemd
    system:
      enabled:
        - libvirtd.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
          - org.dupot.easyflatpak
      - scope: user

  - type: signing
