# yaml-language-server: $schema=https://blue-build.org
name: hlblack
description: Minha imagem pessoal baseada no Fedora Kinoite com Virt-Manager, Waydroid, ADB, Steam (Flatpak) e RPM Fusion.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        - atim/starship
    remove:
      packages:
        - ffmpeg-free
        - libavcodec-free
        - libavdevice-free
        - libavfilter-free
        - libavformat-free
        - libavutil-free
        - libpostproc-free
        - libswresample-free
        - libswscale-free
    install:
      packages:
        # Codecs e Multimídia (RPM Fusion)
        - ffmpeg
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-libav
        - libheif-freeworld

        # Ferramentas Base & Shell
        - micro
        - starship
        - distrobox
        - android-tools

        # Virtualização & Containers Android
        - virt-manager
        - libvirt
        - qemu
        - bridge-utils
        - waydroid

        # Jogos (Regras Udev para Controles no Flatpak)
        - steam-devices

        # Miniaturas e Gerenciador de Arquivos (Dolphin)
        - ffmpegthumbs
        - kdegraphics-thumbnailers
        - qt-heif-image-plugin

        # Compactação & Sistemas de Arquivos
        - unrar
        - p7zip
        - p7zip-plugins

    replace:
      - from-repo: rpmfusion-free
        packages:
          - old: mesa-va-drivers
            new: mesa-va-drivers-freeworld
          - old: mesa-vdpau-drivers
            new: mesa-vdpau-drivers-freeworld

  - type: systemd
    system:
      enabled:
        - libvirtd.service
        - libvirtd.socket
        - waydroid-container.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.valvesoftware.Steam
      - scope: user

  - type: signing
