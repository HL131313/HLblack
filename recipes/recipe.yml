# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Fedora COSMIC Atomic 45 com Virt-Manager, Waydroid, ADB, Steam Nativo, RPM Fusion e drivers Intel Iris Xe.

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        - imput/helium
    install:
      packages:
        # Codecs de software
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-libav
        - libheif-freeworld
        - libavcodec-freeworld

        # Driver de mídia Intel VA-API
        - intel-media-driver
        - libva-utils
        - intel-gpu-tools

        # Ferramentas Base & Shell
        - android-tools

        # Virtualização & Containers
        - distrobox
        - virt-manager
        - waydroid

        # Steam Nativo
        - steam
        - steam-devices

        # Gamescope, MangoHud e Goverlay
        - gamescope
        - mangohud
        - goverlay

        # Etc.
        - helium-bin

  - type: brew
