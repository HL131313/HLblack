# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Fedora Kinoite 45 com Virt-Manager, Waydroid, Steam (Flatpak) e EasyFlatpak.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - distrobox
        # Ferramentas de Virtualização completas (nativo do repositório Fedora)
        - virt-manager
        - libvirt
        - qemu
        - bridge-utils
        # Waydroid
        - waydroid

  - type: systemd
    system:
      enabled:
        - libvirtd.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
          - org.dupot.easyflatpak
          - com.valvesoftware.Steam # Steam oficial em Flatpak (melhor performance e zero conflito de repositório)
      - scope: user

  - type: signing
