# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Aurora com KDE Plasma e RPM Fusion.

base-image: ghcr.io/ublue-os/aurora
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
      custom:
        rpmfusion-free:
          name: RPM Fusion for Fedora 41 - Free
          baseurl: https://mirrors.rpmfusion.org/free/fedora/releases/41/Everything/x86_64/os/
          enabled: true
          gpgcheck: true
          gpgkey: https://mirrors.rpmfusion.org/free/fedora/RPM-GPG-KEY-rpmfusion-free-fedora-41
        rpmfusion-nonfree:
          name: RPM Fusion for Fedora 41 - Nonfree
          baseurl: https://mirrors.rpmfusion.org/nonfree/fedora/releases/41/Everything/x86_64/os/
          enabled: true
          gpgcheck: true
          gpgkey: https://mirrors.rpmfusion.org/nonfree/fedora/RPM-GPG-KEY-rpmfusion-nonfree-fedora-41
    install:
      packages:
        - micro
        - starship
        - steam
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user

  - type: signing
