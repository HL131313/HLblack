# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Fedora Kinoite com Virt-Manager, Waydroid, ADB, Steam (Flatpak) e RPM Fusion.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-45.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-45.noarch.rpm
    copr:
      - atim/starship
    install:
      # Ferramentas Base & Shell
      - micro
      - starship
      - distrobox
      - android-tools
      
      # Virtualização & Containers Android
      - virt-manager
      - libvirt
      - qemu
      - bridge-utils
      - waydroid
      
      # Jogos (Regras Udev para Controles no Flatpak)
      - steam-devices
      
      # Codecs Multimídia & Aceleração de Hardware
      - ffmpeg
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      - gstreamer1-libav
      - mesa-va-drivers-freeworld
      - mesa-vdpau-drivers-freeworld
      - libheif-freeworld
      
      # Miniaturas e Gerenciador de Arquivos (Dolphin)
      - ffmpegthumbs
      - kdegraphics-thumbnailers
      - qt-heif-image-plugin
      
      # Compactação & Sistemas de Arquivos
      - unrar
      - rar
      - p7zip
      - p7zip-plugins
      - unzip
      - zip
      - ntfs-3g
      - exfatprogs

  - type: systemd
    system:
      enabled:
        - libvirtd.service
        - libvirtd.socket
        - waydroid-container.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.valvesoftware.Steam
      - scope: user

  - type: signing
