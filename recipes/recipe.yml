# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Aurora DX com KDE Plasma e Steam nativa.

base-image: ghcr.io/ublue-os/aurora-dx
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - distrobox
        - virt-manager
        - firefox
        - firefox-langpacks
        - steam
        - rpmfusion-nonfree-release # Garante acesso ao repositório não-livre da Steam

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
          # A Steam foi removida daqui para não vir em Flatpak
      - scope: user

  - type: signing
