# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Fedora Kinoite 45 com Virt-Manager, Waydroid, Steam e EasyFlatpak.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: bling
    install:
      - rpmfusion # Instala os repositórios RPMFusion (Free, Non-Free e Tainted) corretamente

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - distrobox
        - steam
        - virt-manager
        - libvirt
        - qemu
        - bridge-utils
        - waydroid

  - type: systemd
    system:
      enabled:
        - libvirtd.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
          - org.dupot.easyflatpak
      - scope: user

  - type: signing
