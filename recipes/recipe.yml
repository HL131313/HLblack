name: hlblack
description: Minha imagem pessoal baseada no Fedora COSMIC Atomic 45 com Virt-Manager, Waydroid, ADB, Steam Nativo, RPM Fusion e drivers Intel Iris Xe.

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        # Codecs (manter no RPM Fusion)
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-libav
        - libheif-freeworld
        - libavcodec-freeworld

        # Driver Intel (manter no dnf)
        - intel-media-driver
        - libva-utils
        - intel-gpu-tools

        # Ferramentas restantes que não estão no Homebrew
        - android-tools
        - virt-manager
        - waydroid
        - steam
        - steam-devices
        - gamescope
        - mangohud
        - goverlay

  - type: script
    scripts:
      - install-homebrew.sh
