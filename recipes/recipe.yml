# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Fedora COSMIC Atomic 45 com Virt-Manager, Waydroid, ADB, Steam Nativo, RPM Fusion e drivers Intel Iris Xe.

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        - atim/starship
    install:
      packages:
        # Codecs de software (RPM Fusion)
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-libav
        - libheif-freeworld
        - libavcodec-freeworld

        # Driver de mídia Intel VA-API (Iris Xe / i5-1135G7)
        - intel-media-driver
        - libva-utils
        - intel-gpu-tools

        # Ferramentas Base & Shell
        - micro
        - starship
        - distrobox
        - android-tools

        # Virtualização & Containers
        - virt-manager
        - waydroid

        # Steam Nativo (RPM Fusion Nonfree)
        - steam
        - steam-devices

  # Módulo de Flatpaks removido (ou mantido apenas se você quiser outros apps)
  # - type: default-flatpaks
  #   configurations:
  #     - scope: user
  #       install:
  #         - com.valvesoftware.Steam
