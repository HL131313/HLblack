# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hlblack
description: Minha imagem pessoal baseada no Fedora Kinoite com Virt-Manager, Waydroid, Steam nativa e EasyFlatpak.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - distrobox
        - firefox
        - firefox-langpacks
        - steam
        # Virt-Manager completo e dependências de virtualização
        - virt-manager
        - libvirt
        - qemu
        - bridge-utils
        - dnsmasq
        # Waydroid
        - waydroid

  - type: systemd
    system:
      enabled:
        - libvirtd.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
          - org.dupot.easyflatpak
      - scope: user

  - type: signing
